[project]
name = "weather-cli"
version = "0.1.0"
description = "Print current temperature and wind speed for a city using Open-Meteo (no API key required)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "abdounesalim450" }]
keywords = ["weather", "cli", "command-line", "terminal", "open-meteo", "forecast"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = ["requests"]

[project.urls]
Homepage = "https://github.com/abdounesalim450/weather-cli"
Repository = "https://github.com/abdounesalim450/weather-cli"
Issues = "https://github.com/abdounesalim450/weather-cli/issues"

[dependency-groups]
dev = ["pytest"]

[project.scripts]
weather-cli = "weather_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["weather_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
